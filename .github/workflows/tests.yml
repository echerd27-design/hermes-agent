name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          set +e
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e --tb=short -n auto --timeout=30 --timeout-method=signal 2>&1 | tee /tmp/pytest-output.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "${rc}" != "0" ]; then
            {
              echo "## Test failures (extracted)"
              echo ""
              echo '```'
              grep -E '^(FAILED|ERROR) tests/' /tmp/pytest-output.log | head -200 || echo "(no FAILED/ERROR lines matched)"
              echo '```'
              echo ""
              echo "### Last 80 lines of pytest output"
              echo '```'
              tail -80 /tmp/pytest-output.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Post pytest failures as PR comment (probe)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f /tmp/pytest-output.log ]; then
            echo "No pytest log captured; skipping comment."
            exit 0
          fi
          {
            echo "## ci-probe: pytest failures (run ${RUN_ID})"
            echo ""
            echo "Job: ${JOB_URL}"
            echo ""
            echo "### FAILED / ERROR lines"
            echo '```'
            grep -E '^(FAILED|ERROR) tests/' /tmp/pytest-output.log | head -200 || echo '(no FAILED/ERROR lines matched)'
            echo '```'
            echo ""
            echo "### Last 120 lines of pytest output"
            echo '```'
            tail -120 /tmp/pytest-output.log
            echo '```'
          } > /tmp/comment.md
          python3 -c "import json,sys; print(json.dumps({'body': sys.stdin.read()}))" < /tmp/comment.md > /tmp/payload.json
          curl -sSf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --data-binary @/tmp/payload.json
          echo
          echo "Posted failure comment to PR #${PR_NUMBER}"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
